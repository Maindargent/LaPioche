# Apache minimal pour servir le front sur http://localhost:8080.
# Lancement : sh serve.sh (depuis le dossier front/), qui copie le front hors de
# Documents puis lance Apache avec ce fichier. Arrêt : Ctrl+C dans le terminal.

ServerName localhost
Listen 8080

# Modules nécessaires : types de fichiers, page par défaut, journaux, autorisations.
LoadModule mpm_prefork_module libexec/apache2/mod_mpm_prefork.so
LoadModule authz_core_module libexec/apache2/mod_authz_core.so
LoadModule mime_module libexec/apache2/mod_mime.so
LoadModule dir_module libexec/apache2/mod_dir.so
LoadModule log_config_module libexec/apache2/mod_log_config.so
LoadModule unixd_module libexec/apache2/mod_unixd.so

# Apache est lancé par vous (sans sudo) et sert le dossier courant, c'est-à-dire la copie faite par serve.sh.
DocumentRoot "${PWD}"
PidFile "${PWD}/httpd.pid"
ErrorLog "/dev/stderr"
LogLevel warn

<Directory "${PWD}">
    Require all granted
    DirectoryIndex index.html
</Directory>

TypesConfig /private/etc/apache2/mime.types
AddType application/javascript .js
